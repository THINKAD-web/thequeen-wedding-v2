<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>더퀸 · 마케팅 어드민</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F2E9;
      --surface: #fff;
      --text: #1a2744;
      --muted: rgba(26,39,68,0.55);
      --line: rgba(26,39,68,0.08);
      --navy: #0E1B33;
      --queen-accent: #BE9E5B;
      --table-accent: #D4A574;
      --table-wine: #6D3E55;
      --status-pending: #94a3b8;
      --status-progress: #BE9E5B;
      --status-done: #2ECC71;
      --shadow: 0 2px 16px rgba(26,39,68,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; }
    .hidden { display: none !important; }
    #checking, #login-screen { min-height: 100vh; background: #0d1526; display: flex; align-items: center; justify-content: center; }
    .login-box { background: #1a2744; padding: 40px; border-radius: 12px; width: 340px; border: 1px solid rgba(184,154,94,0.3); }
    .login-title { color: #c9a85c; font-size: 20px; letter-spacing: 3px; font-family: Georgia, serif; }
    .login-sub { color: rgba(255,255,255,0.5); font-size: 12px; margin: 8px 0 28px; }
    .login-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(184,154,94,0.3); background: rgba(255,255,255,0.05); color: #fff; font-size: 15px; margin-bottom: 12px; }
    .login-box button { width: 100%; padding: 12px; background: #c9a85c; color: #1a2744; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .login-err { color: #ff6b6b; font-size: 12px; margin-bottom: 8px; }
    .header { background: var(--navy); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .header-title { color: var(--queen-accent); font-size: 15px; letter-spacing: 2px; font-family: Georgia, serif; font-weight: 600; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #fff; font-size: 12px; cursor: pointer; }
    .tab-btn.active { background: var(--queen-accent); color: #1a2744; border-color: var(--queen-accent); font-weight: 700; }
    .main { padding: 24px 20px; max-width: 960px; margin: 0 auto; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .card h3 { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
    .dash-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .dash-header h2 { font-size: 18px; font-weight: 600; }
    .dash-header p { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .btn-outline { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; }
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
    @media (min-width: 640px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
    .progress-card { padding: 16px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
    .progress-card-label { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .progress-bar { height: 8px; background: rgba(26,39,68,0.06); border-radius: 999px; overflow: hidden; margin: 8px 0; }
    .progress-bar > i { display: block; height: 100%; border-radius: 999px; transition: width 0.45s ease; }
    .progress-bar.bar-queen > i { background: var(--queen-accent); }
    .progress-bar.bar-table > i { background: var(--table-accent); }
    .progress-bar.bar-total > i { background: #94a3b8; }
    .progress-stat { font-size: 15px; font-weight: 700; }
    .progress-stat span { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 4px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; cursor: pointer; }
    .chip.active { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
    .chip .count { opacity: 0.7; margin-left: 4px; font-size: 11px; }
    .week-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 768px) { .week-grid { grid-template-columns: repeat(4, 1fr); } }
    .week-cell { padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; }
    .week-cell:hover, .week-cell.active { border-color: var(--queen-accent); }
    .week-cell-label { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .week-cell-stat { font-size: 12px; color: var(--muted); }
    .week-cell-theme { font-size: 10px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
    .month-label { font-size: 11px; font-weight: 700; color: var(--muted); margin: 12px 0 8px; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .filter-bar input[type="search"] { flex: 1; min-width: 160px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; }
    .filter-bar select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; }
    .filter-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .filter-label { font-size: 11px; color: var(--muted); font-weight: 700; margin-right: 2px; }
    .task-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
    .task-table th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
    .task-table td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .task-table tr:last-child td { border-bottom: none; }
    .task-table tr { cursor: pointer; transition: background 0.15s; }
    .task-table tr:hover { background: rgba(190,158,91,0.08); }
    .task-table tr.done td.title-cell { text-decoration: line-through; color: var(--muted); }
    .brand-tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
    .brand-tag.queen { background: rgba(190,158,91,0.2); color: #8A6A2E; }
    .brand-tag.table { background: rgba(212,165,116,0.25); color: var(--table-wine); }
    .status-pill { font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
    .status-pill.pending { background: rgba(148,163,184,0.2); color: var(--status-pending); }
    .status-pill.in_progress { background: rgba(190,158,91,0.2); color: var(--status-progress); }
    .status-pill.done { background: rgba(46,204,113,0.15); color: var(--status-done); }
    .title-cell { font-weight: 600; font-size: 13px; }
    .meta-cell { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .status-msg { font-size: 13px; padding: 12px 16px; border-radius: 10px; margin-bottom: 12px; }
    .status-msg.ok { background: rgba(46,204,113,0.12); color: var(--status-done); }
    .status-msg.err { background: rgba(148,163,184,0.2); color: var(--status-pending); }
    .empty { color: var(--muted); font-size: 13px; padding: 32px 20px; text-align: center; }
    @media (max-width: 640px) {
      .task-table thead { display: none; }
      .task-table tr { display: block; padding: 12px; border-bottom: 1px solid var(--line); }
      .task-table td { display: block; padding: 2px 0; border: none; }
      .task-table td::before { content: attr(data-label); font-size: 10px; color: var(--muted); font-weight: 700; display: block; margin-bottom: 2px; }
    }
  </style>
</head>
<body>
  <div id="checking"></div>
  <div id="login-screen" class="hidden">
    <div class="login-box">
      <div class="login-title">THE QUEEN</div>
      <div class="login-sub">마케팅 진행 현황</div>
      <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" />
      <div id="login-err" class="login-err hidden">비밀번호가 틀렸습니다</div>
      <button type="button" id="login-btn">로그인</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="header">
      <div class="header-title">THE QUEEN · 마케팅</div>
      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="dashboard">대시보드</button>
        <button type="button" class="tab-btn" data-tab="tasks">태스크</button>
      </div>
    </div>

    <div class="main">
      <div id="status"></div>

      <div id="tab-dashboard">
        <div class="dash-header">
          <div>
            <h2>2026년 7-8월 캠페인</h2>
            <p>7월 24개 + 8월 16개 = 총 40개</p>
          </div>
          <button type="button" class="btn-outline" id="init-btn">8월 데이터 갱신</button>
        </div>
        <div class="card">
          <div class="grid-3" id="progress-cards"></div>
          <div class="chip-row" id="dash-status-chips"></div>
        </div>
        <div class="card">
          <h3>주차별 진행률</h3>
          <div id="week-months"></div>
        </div>
      </div>

      <div id="tab-tasks" class="hidden">
        <div class="filter-bar">
          <input type="search" id="task-search" placeholder="제목 검색…" />
          <div class="filter-group">
            <span class="filter-label">상태</span>
            <button type="button" class="chip active" data-task-filter="all">전체</button>
            <button type="button" class="chip" data-task-filter="pending">미완료</button>
            <button type="button" class="chip" data-task-filter="in_progress">진행중</button>
            <button type="button" class="chip" data-task-filter="done">완료</button>
          </div>
          <div class="filter-group">
            <span class="filter-label">브랜드</span>
            <button type="button" class="chip active" data-brand-filter="all">전체</button>
            <button type="button" class="chip" data-brand-filter="queen">THE QUEEN</button>
            <button type="button" class="chip" data-brand-filter="table">Queen's Table</button>
          </div>
          <label>주차 <select id="week-select"></select></label>
          <button type="button" class="btn-outline" id="filter-reset">초기화</button>
        </div>
        <div id="task-list"></div>
      </div>
    </div>
  </div>

  <script>
(function () {
  const BRAND_LABELS = { queen: "THE QUEEN", table: "Queen's Table" };
  const STATUS_LABELS = { pending: "미완료", in_progress: "진행중", done: "완료" };
  const STATUS_ORDER = { pending: 0, in_progress: 1, done: 2 };
  const WEEK_LABELS = { 1: "7-1", 2: "7-2", 3: "7-3", 4: "7-4", 5: "8-1", 6: "8-2", 7: "8-3", 8: "8-4" };
  const WEEK_THEMES = {
    queen: {
      5: "홀 투어·Sunday Only",
      6: "예식 가이드·Small Night",
      7: "가을 예약·패키지",
      8: "체크리스트·상담",
    },
    table: {
      5: "프리미엄 포지셔닝",
      6: "기준·셰프 스토리",
      7: "코스·플레이팅 디테일",
      8: "차별화·웨딩 연계",
    },
  };

  let allTasks = [];
  let weeksSummary = [];
  let statusCounts = { total: 0, pending: 0, in_progress: 0, done: 0 };
  let progressAll = {};
  let taskFilter = "all";
  let taskBrandFilter = "all";
  let taskWeekFilter = 0;
  let taskSearch = "";

  const $ = (id) => document.getElementById(id);
  const show = (el) => el.classList.remove("hidden");
  const hide = (el) => el.classList.add("hidden");

  function esc(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function setStatus(kind, msg) {
    const el = $("status");
    if (!msg) { el.innerHTML = ""; return; }
    el.innerHTML = `<div class="status-msg ${kind}">${esc(msg)}</div>`;
  }

  function publishLabel(t) {
    const d = t.specs && t.specs.publish_date;
    if (d) return d;
    return "—";
  }

  function weekDateLabel(t) {
    const label = t.week_label || WEEK_LABELS[t.week_id] || t.week_id;
    return `${label} · ${publishLabel(t)}`;
  }

  async function api(path, opts) {
    const r = await fetch(path, { credentials: "same-origin", ...opts });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || d.detail || "request_failed");
    return d;
  }

  async function checkAuth() {
    const r = await fetch("/api/admin/marketing/tasks?all=1", { credentials: "same-origin" });
    return r.status !== 401;
  }

  async function login() {
    hide($("login-err"));
    const r = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ password: $("pw").value }),
    });
    if (r.ok) { hide($("login-screen")); show($("app")); await init(); }
    else show($("login-err"));
  }

  function pctBar(done, total) {
    return total ? Math.round((done / total) * 100) : 0;
  }

  function renderProgress() {
    const queen = progressAll.queen || { done: 0, total: 0, percent: 0 };
    const table = progressAll.table || { done: 0, total: 0, percent: 0 };
    const totalDone = queen.done + table.done;
    const totalAll = queen.total + table.total;
    $("progress-cards").innerHTML = [
      { label: "THE QUEEN", p: queen, bar: "bar-queen" },
      { label: "Queen's Table", p: table, bar: "bar-table" },
      { label: "전체", p: { done: totalDone, total: totalAll, percent: pctBar(totalDone, totalAll) }, bar: "bar-total" },
    ].map(({ label, p, bar }) => `
      <div class="progress-card">
        <div class="progress-card-label">${label}</div>
        <div class="progress-bar ${bar}"><i style="width:${p.percent}%"></i></div>
        <div class="progress-stat">${p.done}/${p.total} <span>(${p.percent}%)</span></div>
      </div>`).join("");
  }

  function renderStatusChips() {
    const chips = [
      { key: "all", label: "전체", count: statusCounts.total },
      { key: "pending", label: "미완료", count: statusCounts.pending },
      { key: "in_progress", label: "진행중", count: statusCounts.in_progress },
      { key: "done", label: "완료", count: statusCounts.done },
    ];
    $("dash-status-chips").innerHTML = chips.map((c) =>
      `<button type="button" class="chip" data-dash-filter="${c.key}">${c.label}<span class="count">${c.count}</span></button>`
    ).join("");
    $("dash-status-chips").querySelectorAll("[data-dash-filter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        taskFilter = btn.dataset.dashFilter;
        document.querySelectorAll("[data-task-filter]").forEach((b) => {
          b.classList.toggle("active", b.dataset.taskFilter === taskFilter);
        });
        setTab("tasks");
        renderTasks();
      });
    });
  }

  function weekThemeHtml(weekId) {
    const q = WEEK_THEMES.queen[weekId];
    const t = WEEK_THEMES.table[weekId];
    if (!q && !t) return "";
    if (q && t) {
      return `<div class="week-cell-theme">더퀸 ${esc(q)}<br>퀸즈 ${esc(t)}</div>`;
    }
    return `<div class="week-cell-theme">${esc(q || t)}</div>`;
  }

  function renderWeekGrid() {
    const el = $("week-months");
    if (!weeksSummary.length) {
      el.innerHTML = '<div class="empty">데이터 없음 — 8월 데이터 갱신을 실행하세요</div>';
      return;
    }
    const renderCells = (weeks) => weeks.map((w) => {
      const label = w.week_label || WEEK_LABELS[w.week_id];
      const active = taskWeekFilter === w.week_id ? " active" : "";
      return `<div class="week-cell${active}" data-week="${w.week_id}">
        <div class="week-cell-label">${esc(label)}주</div>
        <div class="week-cell-stat">${w.done}/${w.total} 완료</div>
        ${weekThemeHtml(w.week_id)}
      </div>`;
    }).join("");
    el.innerHTML = `
      <div class="month-label">7월</div><div class="week-grid">${renderCells(weeksSummary.filter((w) => w.week_id <= 4))}</div>
      <div class="month-label">8월</div><div class="week-grid">${renderCells(weeksSummary.filter((w) => w.week_id >= 5))}</div>`;
    el.querySelectorAll(".week-cell").forEach((cell) => {
      cell.addEventListener("click", () => {
        taskWeekFilter = Number(cell.dataset.week);
        $("week-select").value = String(taskWeekFilter);
        setTab("tasks");
        renderTasks();
      });
    });
  }

  function getFilteredTasks() {
    let list = [...allTasks];
    if (taskWeekFilter > 0) list = list.filter((t) => t.week_id === taskWeekFilter);
    if (taskFilter !== "all") list = list.filter((t) => t.status === taskFilter);
    if (taskBrandFilter !== "all") list = list.filter((t) => t.brand === taskBrandFilter);
    if (taskSearch.trim()) {
      const q = taskSearch.trim().toLowerCase();
      list = list.filter((t) => (t.title || "").toLowerCase().includes(q));
    }
    list.sort((a, b) => a.week_id - b.week_id || a.brand.localeCompare(b.brand) || a.sort_order - b.sort_order);
    return list;
  }

  function renderTasks() {
    const el = $("task-list");
    const tasks = getFilteredTasks();
    if (!allTasks.length) {
      el.innerHTML = '<div class="card empty">태스크 없음</div>';
      return;
    }
    if (!tasks.length) {
      el.innerHTML = '<div class="card empty">조건에 맞는 태스크가 없습니다</div>';
      return;
    }
    el.innerHTML = `<table class="task-table">
      <thead><tr>
        <th>브랜드</th><th>주차 · 발행일</th><th>채널</th><th>제목</th><th>상태</th>
      </tr></thead>
      <tbody>${tasks.map((t) => `
        <tr class="${t.status === "done" ? "done" : ""}" data-id="${t.id}">
          <td data-label="브랜드"><span class="brand-tag ${t.brand}">${esc(BRAND_LABELS[t.brand])}</span></td>
          <td class="meta-cell" data-label="주차 · 발행일">${esc(weekDateLabel(t))}</td>
          <td class="meta-cell" data-label="채널">${esc(t.channel || "피드")}</td>
          <td class="title-cell" data-label="제목">${esc(t.title || t.task_name)}</td>
          <td data-label="상태"><span class="status-pill ${t.status}">${STATUS_LABELS[t.status]}</span></td>
        </tr>`).join("")}
      </tbody></table>
    <p style="font-size:11px;color:var(--muted);margin-top:10px;text-align:center">행 클릭 → 상태 변경 (미완료 → 진행중 → 완료)</p>`;
    el.querySelectorAll("tr[data-id]").forEach((row) => {
      row.addEventListener("click", () => cycleTaskStatus(row.dataset.id));
    });
  }

  function populateWeekSelect() {
    const sel = $("week-select");
    sel.innerHTML = '<option value="0">전체 주차</option>';
    weeksSummary.forEach((w) => {
      const o = document.createElement("option");
      o.value = w.week_id;
      o.textContent = `${w.week_label || WEEK_LABELS[w.week_id]}주 (${w.done}/${w.total})`;
      sel.appendChild(o);
    });
    sel.value = String(taskWeekFilter || 0);
  }

  async function setTaskStatus(id, status) {
    await api("/api/admin/marketing/tasks", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: Number(id), status }),
    });
    await loadAllTasks();
  }

  function cycleTaskStatus(id) {
    const t = allTasks.find((x) => String(x.id) === String(id));
    if (!t) return;
    const next = t.status === "pending" ? "in_progress" : t.status === "in_progress" ? "done" : "pending";
    setTaskStatus(id, next).catch((e) => setStatus("err", e.message));
  }

  async function loadAllTasks() {
    const d = await api("/api/admin/marketing/tasks?all=1");
    allTasks = d.tasks || [];
    weeksSummary = d.weeks || [];
    statusCounts = d.statusCounts || { total: 0, pending: 0, in_progress: 0, done: 0 };
    progressAll = d.progress || {};
    populateWeekSelect();
    renderProgress();
    renderStatusChips();
    renderWeekGrid();
    renderTasks();
  }

  async function refreshAugust() {
    try {
      const d = await api("/api/admin/marketing/init", { method: "POST" });
      setStatus("ok", `8월 데이터 갱신 완료 · 전체 ${d.tasks}개 (7월 상태 유지)`);
      await loadAllTasks();
    } catch (e) {
      setStatus("err", e.message);
    }
  }

  function setTab(t) {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === t));
    show($("tab-" + t));
    hide($("tab-" + (t === "dashboard" ? "tasks" : "dashboard")));
    if (t === "tasks") renderTasks();
  }

  async function init() {
    try { await loadAllTasks(); }
    catch (e) { setStatus("err", e.message); }
  }

  $("login-btn").addEventListener("click", login);
  $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  document.querySelectorAll(".tab-btn").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
  $("week-select").addEventListener("change", (e) => { taskWeekFilter = Number(e.target.value); renderTasks(); });
  document.querySelectorAll("[data-task-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      taskFilter = btn.dataset.taskFilter;
      document.querySelectorAll("[data-task-filter]").forEach((b) => b.classList.toggle("active", b === btn));
      renderTasks();
    });
  });
  document.querySelectorAll("[data-brand-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      taskBrandFilter = btn.dataset.brandFilter;
      document.querySelectorAll("[data-brand-filter]").forEach((b) => b.classList.toggle("active", b === btn));
      renderTasks();
    });
  });
  $("task-search").addEventListener("input", (e) => { taskSearch = e.target.value; renderTasks(); });
  $("filter-reset").addEventListener("click", () => {
    taskFilter = "all"; taskBrandFilter = "all"; taskWeekFilter = 0; taskSearch = "";
    $("task-search").value = ""; $("week-select").value = "0";
    document.querySelectorAll("[data-task-filter]").forEach((b) => b.classList.toggle("active", b.dataset.taskFilter === "all"));
    document.querySelectorAll("[data-brand-filter]").forEach((b) => b.classList.toggle("active", b.dataset.brandFilter === "all"));
    renderTasks();
  });
  $("init-btn").addEventListener("click", refreshAugust);

  checkAuth().then((ok) => {
    hide($("checking"));
    if (ok) { show($("app")); init(); }
    else show($("login-screen"));
  });
})();
  </script>
</body>
</html>
